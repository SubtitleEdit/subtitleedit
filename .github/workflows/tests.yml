name: Tests

# Runs the whole unit-test suite on pull requests and on pushes to main.
#
# Until this workflow existed nothing ran tests on GitHub: every other workflow here is
# workflow_dispatch only, and the `dotnet test` steps in build-ui.yml / build-seconv.yml
# are commented out. AppVeyor runs LibSETests and UITests on commits, but a broken
# Polish.json still reached main, so the suite also needs to gate merges here.
#
# This covers the translation files as well - UITests contains LanguageJsonFilesTests and
# SeLanguageJsonContextTests - which is why there is no separate language-file workflow:
# building UITests is nearly the whole cost of this job, so a second workflow that builds
# the same project to run 66 of its tests would roughly double CI time for no extra
# coverage.
#
# `dotnet test` on the solution picks up the four test projects (libse, libuilogic,
# seconv, UI); the benchmark projects are not test projects and are skipped.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SubtitleEdit.sln

      - name: Build
        run: dotnet build SubtitleEdit.sln --no-restore

      - name: Test
        id: test
        continue-on-error: true
        run: dotnet test SubtitleEdit.sln --no-build --logger "trx;LogFileName=tests.trx"

      # The headless UI suite has a contamination failure mode no in-test fix can cover:
      # when a test crashes the shared Avalonia dispatcher thread, every later test that
      # needs the headless session fails instantly in cleanup ("calling thread cannot
      # access this object" from AvaloniaHeadlessPlatform.Initialize). A fresh process is
      # the only recovery, so a failed run gets exactly one retry. A real regression fails
      # both runs and still blocks the merge; a pass-on-retry stays visible as a warning
      # annotation plus the first run's trx artifact.
      - name: Retry tests once on failure
        if: steps.test.outcome == 'failure'
        run: |
          echo "::warning title=Flaky test run::First test run failed; retrying once in a fresh process. Check the test-results artifact for the failure."
          dotnet test SubtitleEdit.sln --no-build --logger "trx;LogFileName=tests-retry.trx"

      # Uploaded whenever the first run failed - also on a green retry, so flakes can be
      # diagnosed without re-running locally.
      - name: Upload test results
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
