<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" data-base="{{ site.baseurl }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      (function () {
        var root = document.documentElement;
        var theme = null;
        try { theme = localStorage.getItem('se-docs-theme'); } catch (e) { }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        root.setAttribute('data-theme', theme);
        root.classList.add('js');
      })();
    </script>
{% seo %}
    <link rel="icon" href="{{ '/assets/images/logo.svg' | relative_url }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <script defer src="{{ '/assets/js/docs.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    {% include header.html %}
    <div class="layout">
      {% include sidebar.html %}
      {{ content }}
    </div>
  </body>
</html>
